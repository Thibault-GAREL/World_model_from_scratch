<svg viewBox="0 0 1240 790" xmlns="http://www.w3.org/2000/svg" width="1240" height="790" preserveAspectRatio="xMidYMid meet">
  <title>Violation of Expectation scoring on IntPhys 2</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    </style>

    <filter id="shadow-sm" x="-8%" y="-8%" width="118%" height="128%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <filter id="shadow-md" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000020"/>
    </filter>
    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#EF4444AA"/>
    </filter>

    <marker id="arrow-slate2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrow-red2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="1240" height="790" fill="#FFFFFF"/>

  <!-- ===== TITLE ===== -->
  <text x="40" y="46" font-size="18" font-weight="700" fill="#111827">Violation of Expectation</text>
  <text x="40" y="68" font-size="12" font-weight="400" fill="#6B7280">The infant protocol, applied to a world model. Energy is the machine equivalent of looking time.</text>
  <line x1="40" y1="82" x2="240" y2="82" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== ANALOGY BAND ===== -->
  <g filter="url(#shadow-sm)">
    <rect x="150" y="106" width="400" height="76" rx="12" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.5"/>
  </g>
  <text x="176" y="134" font-size="13" font-weight="700" fill="#9D174D">🍼  Infant, 5 months old</text>
  <text x="176" y="156" font-size="11" font-weight="400" fill="#BE185D">Shown a possible and an impossible scene,</text>
  <text x="176" y="172" font-size="11" font-weight="400" fill="#BE185D">it <tspan font-weight="700">stares longer</tspan> at the impossible one.</text>

  <g>
    <rect x="568" y="130" width="104" height="28" rx="14" fill="#1E293B"/>
    <text x="620" y="149" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">same measure</text>
  </g>

  <g filter="url(#shadow-sm)">
    <rect x="690" y="106" width="400" height="76" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
  </g>
  <text x="716" y="134" font-size="13" font-weight="700" fill="#6D28D9">🤖  JEPA world model</text>
  <text x="716" y="156" font-size="11" font-weight="400" fill="#7C3AED">Shown the same two clips, its prediction</text>
  <text x="716" y="172" font-size="11" font-weight="400" fill="#7C3AED">error <tspan font-weight="700">spikes</tspan> on the impossible one.</text>

  <!-- ================= LEFT PANEL : POSSIBLE ================= -->
  <rect x="50" y="212" width="560" height="424" rx="14" fill="#10B9810D" stroke="#10B98155" stroke-width="1.5" stroke-dasharray="7,4"/>
  <g>
    <rect x="70" y="232" width="176" height="26" rx="13" fill="#10B981"/>
    <text x="158" y="250" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">POSSIBLE  VIDEO</text>
  </g>

  <!-- frames : ball rolls, stops at the wall -->
  <g>
    <rect x="72" y="278" width="112" height="78" rx="6" fill="#1E293B"/>
    <line x1="80" y1="342" x2="176" y2="342" stroke="#475569" stroke-width="2"/>
    <rect x="150" y="302" width="7" height="40" rx="2" fill="#94A3B8"/>
    <circle cx="96" cy="332" r="9" fill="#FFFFFF"/>
    <text x="128" y="370" font-size="9.5" fill="#94A3B8" text-anchor="middle">t = 0</text>
  </g>
  <g>
    <rect x="204" y="278" width="112" height="78" rx="6" fill="#1E293B"/>
    <line x1="212" y1="342" x2="308" y2="342" stroke="#475569" stroke-width="2"/>
    <rect x="282" y="302" width="7" height="40" rx="2" fill="#94A3B8"/>
    <circle cx="248" cy="332" r="9" fill="#FFFFFF"/>
    <text x="260" y="370" font-size="9.5" fill="#94A3B8" text-anchor="middle">t = 1</text>
  </g>
  <g>
    <rect x="336" y="278" width="112" height="78" rx="6" fill="#1E293B"/>
    <line x1="344" y1="342" x2="440" y2="342" stroke="#475569" stroke-width="2"/>
    <rect x="414" y="302" width="7" height="40" rx="2" fill="#94A3B8"/>
    <circle cx="400" cy="332" r="9" fill="#FFFFFF"/>
    <text x="392" y="370" font-size="9.5" fill="#94A3B8" text-anchor="middle">t = 2</text>
  </g>
  <g>
    <rect x="468" y="278" width="112" height="78" rx="6" fill="#1E293B"/>
    <line x1="476" y1="342" x2="572" y2="342" stroke="#475569" stroke-width="2"/>
    <rect x="546" y="302" width="7" height="40" rx="2" fill="#94A3B8"/>
    <circle cx="506" cy="332" r="9" fill="#FFFFFF"/>
    <text x="524" y="370" font-size="9.5" fill="#94A3B8" text-anchor="middle">t = 3</text>
  </g>
  <text x="330" y="394" font-size="11" font-weight="500" fill="#047857" text-anchor="middle">The ball hits the wall and bounces back.</text>

  <!-- energy plot : flat -->
  <text x="72" y="424" font-size="10" font-weight="600" fill="#64748B">ENERGY  C</text>
  <line x1="90" y1="432" x2="90" y2="546" stroke="#CBD5E1" stroke-width="1.4"/>
  <line x1="90" y1="546" x2="580" y2="546" stroke="#CBD5E1" stroke-width="1.4"/>
  <line x1="90" y1="512" x2="580" y2="512" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>
  <polyline points="98,522 160,516 222,524 284,518 346,522 408,514 470,520 532,517 574,521"
            fill="none" stroke="#10B981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="586" y="550" font-size="9.5" fill="#94A3B8">time</text>

  <!-- verdict -->
  <g filter="url(#shadow-sm)">
    <rect x="72" y="570" width="508" height="46" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  </g>
  <text x="326" y="598" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle">Flat, low energy  →  the world behaved as predicted</text>

  <!-- ================= RIGHT PANEL : IMPOSSIBLE ================= -->
  <rect x="630" y="212" width="560" height="424" rx="14" fill="#EF44440D" stroke="#EF444455" stroke-width="1.5" stroke-dasharray="7,4"/>
  <g>
    <rect x="650" y="232" width="196" height="26" rx="13" fill="#EF4444"/>
    <text x="748" y="250" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">IMPOSSIBLE  VIDEO</text>
  </g>

  <!-- frames : ball goes through the wall -->
  <g>
    <rect x="652" y="278" width="112" height="78" rx="6" fill="#1E293B"/>
    <line x1="660" y1="342" x2="756" y2="342" stroke="#475569" stroke-width="2"/>
    <rect x="730" y="302" width="7" height="40" rx="2" fill="#94A3B8"/>
    <circle cx="676" cy="332" r="9" fill="#FFFFFF"/>
    <text x="708" y="370" font-size="9.5" fill="#94A3B8" text-anchor="middle">t = 0</text>
  </g>
  <g>
    <rect x="784" y="278" width="112" height="78" rx="6" fill="#1E293B"/>
    <line x1="792" y1="342" x2="888" y2="342" stroke="#475569" stroke-width="2"/>
    <rect x="862" y="302" width="7" height="40" rx="2" fill="#94A3B8"/>
    <circle cx="828" cy="332" r="9" fill="#FFFFFF"/>
    <text x="840" y="370" font-size="9.5" fill="#94A3B8" text-anchor="middle">t = 1</text>
  </g>
  <g>
    <rect x="916" y="278" width="112" height="78" rx="6" fill="#1E293B"/>
    <line x1="924" y1="342" x2="1020" y2="342" stroke="#475569" stroke-width="2"/>
    <rect x="994" y="302" width="7" height="40" rx="2" fill="#94A3B8"/>
    <circle cx="980" cy="332" r="9" fill="#FFFFFF"/>
    <text x="972" y="370" font-size="9.5" fill="#94A3B8" text-anchor="middle">t = 2</text>
  </g>
  <g filter="url(#glow-red)">
    <rect x="1048" y="278" width="112" height="78" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
  </g>
  <line x1="1056" y1="342" x2="1152" y2="342" stroke="#475569" stroke-width="2"/>
  <rect x="1126" y="302" width="7" height="40" rx="2" fill="#94A3B8"/>
  <circle cx="1146" cy="332" r="9" fill="#FFFFFF"/>
  <text x="1104" y="370" font-size="9.5" font-weight="700" fill="#DC2626" text-anchor="middle">t = 3   solidity</text>

  <text x="910" y="394" font-size="11" font-weight="500" fill="#B91C1C" text-anchor="middle">The ball passed straight through a solid wall.</text>

  <!-- energy plot : spike -->
  <text x="652" y="424" font-size="10" font-weight="600" fill="#64748B">ENERGY  C</text>
  <line x1="670" y1="432" x2="670" y2="546" stroke="#CBD5E1" stroke-width="1.4"/>
  <line x1="670" y1="546" x2="1160" y2="546" stroke="#CBD5E1" stroke-width="1.4"/>
  <line x1="670" y1="512" x2="1160" y2="512" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>
  <polyline points="678,522 740,517 802,523 864,516 926,521 988,514 1020,448 1052,470 1114,505 1154,516"
            fill="none" stroke="#EF4444" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1020" cy="448" r="5" fill="#EF4444"/>
  <path d="M 946,462 L 992,451" fill="none" stroke="#EF4444" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-red2)"/>
  <text x="878" y="459" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">surprise</text>
  <text x="1166" y="550" font-size="9.5" fill="#94A3B8">time</text>

  <!-- verdict -->
  <g filter="url(#shadow-sm)">
    <rect x="652" y="570" width="508" height="46" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  </g>
  <text x="906" y="598" font-size="12.5" font-weight="700" fill="#991B1B" text-anchor="middle">Energy spike  →  a law the model learned was broken</text>

  <!-- ================= SCORING BAND ================= -->
  <g filter="url(#shadow-sm)">
    <rect x="50" y="662" width="560" height="94" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
  <rect x="50" y="662" width="4" height="94" rx="2" fill="#3B82F6"/>
  <text x="76" y="690" font-size="12.5" font-weight="700" fill="#1D4ED8">Relative score  (pairwise)</text>
  <text x="76" y="712" font-size="11" font-weight="400" fill="#475569">Inside one quadruplet, does the impossible clip get the</text>
  <text x="76" y="730" font-size="11" font-weight="400" fill="#475569">higher energy than its possible twin ? This is the infant</text>
  <text x="76" y="748" font-size="11" font-weight="400" fill="#475569">protocol exactly, and the easier of the two metrics.</text>

  <g filter="url(#shadow-sm)">
    <rect x="630" y="662" width="560" height="94" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
  <rect x="630" y="662" width="4" height="94" rx="2" fill="#EAB308"/>
  <text x="656" y="690" font-size="12.5" font-weight="700" fill="#854D0E">Absolute score  (binary)</text>
  <text x="656" y="712" font-size="11" font-weight="400" fill="#475569">Judge a single clip with nothing to compare it to. This</text>
  <text x="656" y="730" font-size="11" font-weight="400" fill="#475569">needs the energy scale itself to mean something, which</text>
  <text x="656" y="748" font-size="11" font-weight="400" fill="#475569">is exactly what the regulariser is there to guarantee.</text>
</svg>
