<svg viewBox="0 0 1240 780" xmlns="http://www.w3.org/2000/svg" width="1240" height="780" preserveAspectRatio="xMidYMid meet">
  <title>JEPA World Model Architecture</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    </style>

    <filter id="shadow-sm" x="-8%" y="-8%" width="118%" height="128%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <filter id="shadow-md" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000020"/>
    </filter>

    <marker id="arrow-slate" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#EAB308"/>
    </marker>
    <marker id="arrow-blue-dash" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#3B82F6"/>
    </marker>
    <marker id="mini-arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <rect width="1240" height="780" fill="#FFFFFF"/>

  <!-- ===== TITLE ===== -->
  <text x="40" y="46" font-size="18" font-weight="700" fill="#111827">JEPA World Model</text>
  <text x="40" y="68" font-size="12" font-weight="400" fill="#6B7280">Predict the representation, never the pixels. The prediction error becomes the surprise.</text>
  <line x1="40" y1="82" x2="240" y2="82" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== BRANCH LABELS ===== -->
  <g>
    <rect x="40" y="150" width="96" height="20" rx="10" fill="#EFF6FF"/>
    <text x="88" y="164" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="middle">CONTEXT PATH</text>
  </g>
  <g>
    <rect x="40" y="430" width="96" height="20" rx="10" fill="#F1F5F9"/>
    <text x="88" y="444" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">TARGET PATH</text>
  </g>

  <!-- ===== CONTEXT FRAMES (input, orange) ===== -->
  <g filter="url(#shadow-sm)">
    <rect x="70" y="188" width="110" height="94" rx="10" fill="#FFEDD5" stroke="#F97316" stroke-width="1.5"/>
    <rect x="62" y="180" width="110" height="94" rx="10" fill="#FFEDD5" stroke="#F97316" stroke-width="1.5"/>
  </g>
  <text x="117" y="216" font-size="12" font-weight="600" fill="#9A3412" text-anchor="middle">Context</text>
  <text x="117" y="234" font-size="12" font-weight="600" fill="#9A3412" text-anchor="middle">frames</text>
  <text x="117" y="254" font-size="11" font-weight="400" fill="#C2410C" text-anchor="middle">o<tspan font-size="8" dy="3">t-k…t</tspan></text>

  <!-- ===== ENCODER (trapezoid, blue) ===== -->
  <path d="M 240,160 L 380,186 L 380,244 L 240,270 Z" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8" filter="url(#shadow-sm)"/>
  <text x="300" y="208" font-size="13" font-weight="600" fill="#1D4ED8" text-anchor="middle">Encoder</text>
  <text x="300" y="230" font-size="14" font-weight="600" fill="#3B82F6" text-anchor="middle">f<tspan font-size="10" dy="3">θ</tspan></text>

  <!-- ===== z_t ===== -->
  <rect x="440" y="195" width="60" height="40" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="470" y="220" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">z<tspan font-size="10" dy="3">t</tspan></text>

  <!-- ===== PREDICTOR (half-circle / D shape, violet) ===== -->
  <path d="M 560,160 L 670,160 A 55,55 0 0 1 670,270 L 560,270 Z" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.8" filter="url(#shadow-sm)"/>
  <text x="630" y="186" font-size="13" font-weight="600" fill="#6D28D9" text-anchor="middle">Predictor</text>
  <text x="630" y="206" font-size="14" font-weight="600" fill="#8B5CF6" text-anchor="middle">g<tspan font-size="10" dy="3">φ</tspan></text>
  <!-- mini neural-net glyph -->
  <g transform="translate(578,216)">
    <line x1="12" y1="14" x2="43" y2="7" stroke="#C4B5FD" stroke-width="1.1" marker-end="url(#mini-arrow)"/>
    <line x1="12" y1="14" x2="43" y2="22" stroke="#C4B5FD" stroke-width="1.1" marker-end="url(#mini-arrow)"/>
    <line x1="12" y1="14" x2="43" y2="37" stroke="#C4B5FD" stroke-width="1.1" marker-end="url(#mini-arrow)"/>
    <line x1="12" y1="32" x2="43" y2="7" stroke="#C4B5FD" stroke-width="1.1" marker-end="url(#mini-arrow)"/>
    <line x1="12" y1="32" x2="43" y2="22" stroke="#C4B5FD" stroke-width="1.1" marker-end="url(#mini-arrow)"/>
    <line x1="12" y1="32" x2="43" y2="37" stroke="#C4B5FD" stroke-width="1.1" marker-end="url(#mini-arrow)"/>
    <circle cx="8" cy="14" r="5" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.3"/>
    <circle cx="8" cy="32" r="5" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.3"/>
    <circle cx="49" cy="7" r="5" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.3"/>
    <circle cx="49" cy="22" r="5" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.3"/>
    <circle cx="49" cy="37" r="5" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.3"/>
  </g>

  <!-- ===== z_hat ===== -->
  <rect x="780" y="195" width="64" height="40" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="812" y="220" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">ẑ<tspan font-size="10" dy="3">t+1</tspan></text>

  <!-- ===== TARGET FRAME (input, orange) ===== -->
  <rect x="62" y="450" width="110" height="94" rx="10" fill="#FFEDD5" stroke="#F97316" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <text x="117" y="486" font-size="12" font-weight="600" fill="#9A3412" text-anchor="middle">Future</text>
  <text x="117" y="504" font-size="12" font-weight="600" fill="#9A3412" text-anchor="middle">frame</text>
  <text x="117" y="524" font-size="11" font-weight="400" fill="#C2410C" text-anchor="middle">o<tspan font-size="8" dy="3">t+1</tspan></text>

  <!-- ===== TARGET ENCODER (trapezoid, dashed blue) ===== -->
  <path d="M 240,440 L 380,466 L 380,524 L 240,550 Z" fill="#F8FAFC" stroke="#93C5FD" stroke-width="1.8" stroke-dasharray="6,3" filter="url(#shadow-sm)"/>
  <text x="300" y="484" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">Target Enc.</text>
  <text x="300" y="506" font-size="14" font-weight="600" fill="#60A5FA" text-anchor="middle">f<tspan font-size="10" dy="3">θ'</tspan></text>

  <!-- ===== z_t+1 ===== -->
  <rect x="440" y="475" width="64" height="40" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="472" y="500" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">z<tspan font-size="10" dy="3">t+1</tspan></text>

  <!-- ===== ENERGY (output, emerald) ===== -->
  <rect x="900" y="300" width="170" height="112" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#shadow-md)"/>
  <text x="985" y="332" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Energy  C</text>
  <line x1="924" y1="344" x2="1046" y2="344" stroke="#A7F3D0" stroke-width="1.2"/>
  <text x="985" y="368" font-size="13" font-weight="600" fill="#047857" text-anchor="middle">‖ ẑ − z ‖²</text>
  <text x="985" y="392" font-size="10.5" font-weight="400" fill="#059669" text-anchor="middle">one scalar per frame</text>

  <!-- ===== REGULARISER R (important, yellow) ===== -->
  <rect x="520" y="600" width="230" height="80" rx="10" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.8" filter="url(#shadow-sm)"/>
  <text x="635" y="628" font-size="13" font-weight="700" fill="#854D0E" text-anchor="middle">Regulariser  R</text>
  <text x="635" y="648" font-size="10.5" font-weight="400" fill="#A16207" text-anchor="middle">VICReg : variance ≥ 1,</text>
  <text x="635" y="664" font-size="10.5" font-weight="400" fill="#A16207" text-anchor="middle">covariance → 0</text>

  <!-- ===== ARROWS : context path ===== -->
  <line x1="174" y1="215" x2="236" y2="215" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  <line x1="380" y1="215" x2="436" y2="215" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  <line x1="500" y1="215" x2="556" y2="215" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  <line x1="725" y1="215" x2="776" y2="215" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- ===== ARROWS : target path ===== -->
  <line x1="174" y1="495" x2="236" y2="495" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  <line x1="380" y1="495" x2="436" y2="495" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- ===== ARROWS : into the energy ===== -->
  <path d="M 844,215 L 858,215 Q 878,215 878,235 L 878,320 Q 878,340 898,340"
        fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-emerald)"/>
  <path d="M 504,495 L 858,495 Q 878,495 878,475 L 878,392 Q 878,372 898,372"
        fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-emerald)"/>

  <!-- ===== ARROW : EMA copy ===== -->
  <path d="M 310,240 L 310,436"
        fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6,4" stroke-linecap="round" marker-end="url(#arrow-blue-dash)"/>
  <g>
    <rect x="322" y="318" width="128" height="42" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="386" y="335" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">EMA copy</text>
    <text x="386" y="351" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">stop-gradient</text>
  </g>

  <!-- ===== ARROWS : regulariser ===== -->
  <path d="M 440,215 L 420,215 Q 400,215 400,235 L 400,596 Q 400,616 420,616 L 516,616"
        fill="none" stroke="#EAB308" stroke-width="1.4" stroke-dasharray="5,3" stroke-linecap="round" marker-end="url(#arrow-yellow)"/>
  <path d="M 472,515 L 472,632 Q 472,652 492,652 L 516,652"
        fill="none" stroke="#EAB308" stroke-width="1.4" stroke-dasharray="5,3" stroke-linecap="round" marker-end="url(#arrow-yellow)"/>

  <!-- ===== ANNOTATION : no decoder ===== -->
  <g>
    <rect x="870" y="108" width="330" height="84" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="1035" y="136" font-size="12.5" font-weight="700" fill="#991B1B" text-anchor="middle">No decoder anywhere</text>
    <text x="1035" y="157" font-size="10.5" font-weight="400" fill="#B91C1C" text-anchor="middle">Nothing is ever reconstructed, so the model</text>
    <text x="1035" y="173" font-size="10.5" font-weight="400" fill="#B91C1C" text-anchor="middle">may ignore what it cannot predict.</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <g transform="translate(830,592)">
    <rect width="330" height="96" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="22" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.6">LEGEND</text>

    <path d="M 16,34 L 44,39 L 44,51 L 16,56 Z" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.3"/>
    <text x="54" y="49" font-size="10.5" fill="#334155">Encoder</text>

    <path d="M 150,34 L 166,34 A 11,11 0 0 1 166,56 L 150,56 Z" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.3"/>
    <text x="186" y="49" font-size="10.5" fill="#334155">Predictor</text>

    <rect x="16" y="66" width="28" height="18" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/>
    <text x="54" y="79" font-size="10.5" fill="#334155">Representation</text>

    <rect x="150" y="66" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1.3"/>
    <text x="186" y="79" font-size="10.5" fill="#334155">Cost / energy</text>
  </g>

  <!-- ===== FOOTER NOTE ===== -->
  <text x="40" y="714" font-size="11" font-weight="400" fill="#6B7280">Configuration (b) Video of the eb_jepa taxonomy. IntPhys 2 clips are passive, so the predictor is conditioned on a time offset rather than an action.</text>
  <text x="40" y="734" font-size="11" font-weight="400" fill="#6B7280">At evaluation nothing is trained : the model only watches, and the frames where C spikes are the frames where physics broke.</text>
</svg>
